pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "**/*.{js,ts,jsx,tsx,mjs,cjs,astro}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    stylelint:
      glob: "**/*.{css,scss}"
      run: bunx stylelint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    protect-main:
      interactive: true
      run: bun scripts/confirm-push.ts